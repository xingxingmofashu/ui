<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="A compact Vite + React 19 + Tailwind CSS 4 landing-page starter built from the Liquid Glass shadcn registry."
    />
    <meta
      name="theme-color"
      content="#eceef2"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#07080b"
      media="(prefers-color-scheme: dark)"
    />
    <title>Lumen — Liquid Glass React starter</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("lumen-theme");
          const dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;

          root.classList.toggle("dark", dark);
          root.classList.toggle("light", !dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
