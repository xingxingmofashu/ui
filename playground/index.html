<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="A live React REPL for @xingxingmofashu/ui. Write TSX, see the component render, and inspect console output."
    />
    <title>Liquid Glass REPL</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("ui-playground-theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : prefersDark
                ? "dark"
                : "light";
          const storedGlass = localStorage.getItem("ui-playground-glass");
          const glass =
            storedGlass === "thin" ||
            storedGlass === "soft" ||
            storedGlass === "regular" ||
            storedGlass === "thick"
              ? storedGlass
              : "thin";
          const root = document.documentElement;

          root.dataset.theme = theme;
          root.dataset.glass = glass;
          root.classList.toggle("dark", theme === "dark");
          root.classList.toggle("light", theme === "light");
          root.style.colorScheme = theme;

          const scheme = document.querySelector('meta[name="color-scheme"]');

          if (scheme) {
            scheme.content = theme;
          }
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.glass = "thin";
          document.documentElement.style.colorScheme = "light";

          const scheme = document.querySelector('meta[name="color-scheme"]');

          if (scheme) {
            scheme.content = "light";
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
