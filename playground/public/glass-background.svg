<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12052e" />
      <stop offset="0.45" stop-color="#16255c" />
      <stop offset="1" stop-color="#2b0736" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#ffffff" fill-opacity="0.28" />
      <circle cx="17" cy="17" r="1.1" fill="#ffd60a" fill-opacity="0.38" />
    </pattern>
    <pattern id="lines" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="46" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" />
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)" />

  <g filter="url(#soft)" opacity="0.9">
    <circle cx="210" cy="180" r="330" fill="#ff2d55" />
    <circle cx="1370" cy="120" r="290" fill="#ff9f0a" />
    <circle cx="1280" cy="860" r="380" fill="#30d158" />
    <circle cx="180" cy="880" r="320" fill="#0a84ff" />
    <circle cx="820" cy="520" r="250" fill="#bf5af2" />
    <circle cx="560" cy="120" r="160" fill="#64d2ff" />
  </g>

  <g fill="none" stroke-linecap="round">
    <circle cx="820" cy="520" r="330" stroke="#ffffff" stroke-opacity="0.32" stroke-width="3" />
    <circle cx="820" cy="520" r="220" stroke="#ffd60a" stroke-opacity="0.45" stroke-width="2" />
    <circle cx="820" cy="520" r="110" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" />
    <path d="M-80 780 C 260 620, 560 900, 880 740 S 1400 620, 1700 800" stroke="#64d2ff" stroke-opacity="0.55" stroke-width="3" />
    <path d="M-60 300 C 300 420, 620 160, 980 300 S 1420 420, 1680 240" stroke="#ff9f0a" stroke-opacity="0.45" stroke-width="2" />
  </g>

  <rect width="1600" height="1000" fill="url(#dots)" />
  <rect width="1600" height="1000" fill="url(#lines)" />
</svg>
