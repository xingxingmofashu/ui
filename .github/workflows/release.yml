name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"

          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"

          if [[ "$version" == *-* ]]; then
            dist_tag="${version#*-}"
            dist_tag="${dist_tag%%.*}"
          else
            dist_tag="latest"
          fi

          pnpm publish --tag "$dist_tag" --no-git-checks --provenance

      - name: Pack
        run: pnpm pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes
